# Render Blueprint for the API. In Render: New → Blueprint → connect this repo.
# Render builds the Dockerfile (whose default CMD runs the API) and injects PORT.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: medication-tracker-api
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: APP_TIMEZONE
        value: Europe/London
      - key: WEB_ORIGIN
        value: https://saywhat36.github.io # the Pages site origin (for CORS)
      - key: DATABASE_URL
        sync: false # your Neon connection string
      - key: API_TOKEN
        sync: false # a long random secret (openssl rand -hex 32)
      - key: APP_PASSWORD
        sync: false # the password you'll type into the web login
      - key: LINK_SIGNING_SECRET
        sync: false # a long random secret (openssl rand -hex 32) — must match
        # the GitHub Actions LINK_SIGNING_SECRET used by the reminders workflow,
        # since one signs the tap-to-take email links and the other verifies them
