name: Reminders

on:
  schedule:
    # Hourly, on the hour (UTC). GitHub's scheduler can run a few minutes late.
    - cron: '0 * * * *'
  # Lets you run it on demand from the Actions tab (handy for testing).
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Single overdue-check against the hosted DB. Sends per-medication
      # reminder/missed/taken emails via Gmail (preferred — free, sends to
      # anyone) when GMAIL_USER/GMAIL_APP_PASSWORD are set, else Resend when
      # RESEND_API_KEY is set (limited to your own address without a verified
      # domain — see .env.example); falls back to Telegram, then console
      # logging. Secrets are configured in the repo (Settings → Secrets and
      # variables → Actions).
      - run: npm run sweep:once --workspace @medication-tracker/sweep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          # Must be the exact same value as the API service's LINK_SIGNING_SECRET
          # (Render) — this signs tap-to-take links, the API verifies them.
          LINK_SIGNING_SECRET: ${{ secrets.LINK_SIGNING_SECRET }}
          # The API's public URL, e.g. https://medication-tracker-api-s454.onrender.com
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Set an APP_TIMEZONE repo variable (e.g. Europe/London) for local-time
          # reminders; defaults to UTC if unset.
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
